name: refresh-payload

# Daily refresh of public/data.json (collect → validate → push → Vercel rebuilds).
#
# IMPORTANT: this MUST run on a self-hosted runner INSIDE the VPC. A GitHub-hosted
# runner (ubuntu-latest) lives in public cloud and cannot reach the internal RDS /
# MCP gateway (10.238.x.x), so collect.py would fail. Register a self-hosted runner
# labelled `luckin-internal` on a host with DB reach + AWS creds:
#   Repo → Settings → Actions → Runners → New self-hosted runner.

on:
  workflow_dispatch:            # manual "Run workflow" button (out-of-band refresh)
  schedule:
    - cron: '0 9 * * *'         # daily 09:00 UTC (~04:00–05:00 ET). Adjust as needed.

permissions:
  contents: write               # lets the built-in GITHUB_TOKEN commit public/data.json

concurrency:
  group: refresh-payload
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: [self-hosted, luckin-internal]   # the VPC-bridged runner label
    env:
      AWS_REGION: us-east-1
      MYSQL_SECRET_NAME: ${{ secrets.MYSQL_SECRET_NAME }}   # e.g. collector/mysql
      IEHR_HOST: ${{ secrets.IEHR_HOST }}                   # optional per-DB host override
      OPEMPEFFICIENCY_HOST: ${{ secrets.OPEMPEFFICIENCY_HOST }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}             # built-in; no PAT to manage
      GITHUB_REPO: ${{ github.repository }}                 # auto-resolves to this repo
      GITHUB_BRANCH: ${{ github.ref_name }}
      GITHUB_FILE_PATH: public/data.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pipeline deps
        run: pip install -r pipeline/requirements.txt

      - name: Run refresh (collect → validate → push)
        run: bash refresh.sh

      # Vercel auto-deploys on the public/data.json push — no extra step needed.
      # (Optional belt-and-suspenders: curl a Vercel Deploy Hook here.)
